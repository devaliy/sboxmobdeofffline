name: success_offline
description: "SuccessBOX — offline-first study & CBT practice app for Nigerian secondary-school / JAMB-WAEC-NECO candidates."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Local databases
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.3

  # Auth / secure storage
  flutter_secure_storage: ^9.2.4

  # Background sync
  workmanager: ^0.6.0

  # Content pack download/import
  archive: ^3.6.1
  crypto: ^3.0.6

  # Study Center content rendering
  flutter_html: ^3.0.0-beta.2

  # Charts (Progress tab)
  fl_chart: ^0.70.2

  # Local, non-sensitive settings
  shared_preferences: ^2.3.5

  # Motion / loading
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # IDs
  uuid: ^4.5.1

  # Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  # Removed after generating the splash assets (already committed under
  # android/app/src/main/res and ios/Runner) — its own bundled Android
  # Gradle module is compiled against an old SDK (31) that fails
  # `checkReleaseAarMetadata` against current AndroidX transitive deps,
  # and Flutter registers dev_dependencies' native code in the Gradle
  # build the same as regular ones, so there's no way to keep the
  # dependency without hitting that. Re-add temporarily (`flutter pub add
  # -d flutter_native_splash`) only if the splash design needs
  # regenerating — the `flutter_native_splash:` config below is left in
  # place for exactly that.
  # flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - sboxscreens/SuccessBOX-Logo.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon_master.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1E33"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/branding/app_icon_master.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/app_icon_master.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon_master.png"
    background_color: "#1A1E33"
    theme_color: "#FF7A1A"

flutter_native_splash:
  color: "#1A1E33"
  image: assets/branding/app_icon_master.png
  color_dark: "#12142A"
  image_dark: assets/branding/app_icon_master.png
  android_12:
    image: assets/branding/app_icon_foreground.png
    icon_background_color: "#1A1E33"
    image_dark: assets/branding/app_icon_foreground.png
    icon_background_color_dark: "#12142A"
  web: false
